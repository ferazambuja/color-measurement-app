name: Prepare portable beta candidates

# Deliberate target builds only. Public artifacts are readable by repository
# readers; private runs consume minutes and all artifacts can consume storage.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to qualify and package (no publication)
        type: choice
        options: [linux, windows-x64, windows-arm64, all]
        default: linux

permissions:
  contents: read

concurrency:
  group: portable-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    name: Matching app, Argyll and Qt source set
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.11"
      - name: Prepare matching source attachments
        run: |
          mkdir sources
          curl --fail --location --retry 2 --output sources/Argyll_V3.5.0_src.zip https://www.argyllcms.com/Argyll_V3.5.0_src.zip
          echo 'f8576ce5589fd15620abb73ff049ea31f55ddbd1bba6d1ffa87452658e7bc85f  sources/Argyll_V3.5.0_src.zip' | sha256sum --check
          uv build --sdist --out-dir sources
          uv run --locked python tools/collect_runtime_sources.py sources
      # Exactly the four attachments: each package job verifies them, and its
      # SOURCE-MANIFEST.json and SHA256SUMS bind them to that delivery.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corresponding-source-${{ github.sha }}
          path: sources/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  linux:
    name: Linux x64 / glibc 2.36
    if: inputs.target == 'linux' || inputs.target == 'all'
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build fixed Linux environment
        run: docker build --platform linux/amd64 -t cm-beta-linux -f tools/desktop_builder/linux.Dockerfile .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: corresponding-source-${{ github.sha }}
          path: local/beta/sources
      - name: Full software gate and target package without production execution
        run: |
          mkdir -p local/beta
          docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE:/project" cm-beta-linux sh -ec '
            uv sync --locked --extra app --group app-build
            npm ci --prefix tools/desktop_builder --ignore-scripts --no-audit --no-fund
            curl --fail --location --retry 2 --output local/beta/Argyll_V3.5.0_src.zip https://www.argyllcms.com/Argyll_V3.5.0_src.zip
            echo "f8576ce5589fd15620abb73ff049ea31f55ddbd1bba6d1ffa87452658e7bc85f  local/beta/Argyll_V3.5.0_src.zip" | sha256sum --check
            uv run --locked --extra app python tools/test_all.py --require-mat --jobs 4 --argyll-archive local/beta/Argyll_V3.5.0_src.zip --argyll-contribution tools/native_argyll/contributions/cr_pr --native-output local/beta/native
            uv run --locked --extra app --group app-build python tools/build_desktop_app.py --instrument-build-report local/beta/native/report.json --output local/beta/application --build local/beta/build
            uv run --locked python tools/prepare_beta_assets.py --application "local/beta/application/Color Measurement" --native-report local/beta/native/report.json --source-directory local/beta/sources --output local/beta/assets
          '
      # The corresponding-source artifact already retains the four large source
      # attachments. Combine both artifacts before delivery; do not upload them twice.
      - name: Retain candidate records and original gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-candidate-${{ github.sha }}
          path: |
            local/beta/assets/Color-Measurement-*
            local/beta/assets/RELEASE.txt
            local/beta/assets/SOURCE-MANIFEST.json
            local/beta/assets/SHA256SUMS
            local/beta/native/report.json
            local/beta/native/**/*.log
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows / ${{ matrix.arch }}
    if: inputs.target == 'windows-x64' || inputs.target == 'windows-arm64' || inputs.target == 'all'
    needs: sources
    runs-on: ${{ matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.target == 'windows-x64' && '["x86_64"]' || inputs.target == 'windows-arm64' && '["aarch64"]' || '["x86_64", "aarch64"]') }}
    env:
      PYTHONUTF8: "1"
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          # An ARM runner can execute x64 tools. Require a native managed Python
          # explicitly, using the Windows ARM64 build available from Python 3.13.
          python-version: ${{ matrix.arch == 'aarch64' && 'cpython-3.13-windows-aarch64-none' || '3.11' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        id: msys2
        with:
          msystem: ${{ matrix.arch == 'aarch64' && 'CLANGARM64' || 'CLANG64' }}
          release: true
          update: true
          install: >-
            mingw-w64-clang-${{ matrix.arch }}-clang
            mingw-w64-clang-${{ matrix.arch }}-compiler-rt
            mingw-w64-clang-${{ matrix.arch }}-binutils
      - name: Expose native compiler and obtain pinned Argyll source
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          COMPILER_DIRECTORY: ${{ matrix.arch == 'aarch64' && 'clangarm64/bin' || 'clang64/bin' }}
        run: |
          Add-Content $env:GITHUB_PATH (Join-Path $env:MSYS2_LOCATION $env:COMPILER_DIRECTORY)
          New-Item -ItemType Directory -Force local/beta | Out-Null
          curl.exe --fail --location --retry 2 --output local/beta/Argyll_V3.5.0_src.zip https://www.argyllcms.com/Argyll_V3.5.0_src.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash local/beta/Argyll_V3.5.0_src.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f8576ce5589fd15620abb73ff049ea31f55ddbd1bba6d1ffa87452658e7bc85f') { throw 'Source digest mismatch' }
      - name: Install locked application and renderer tools
        shell: pwsh
        run: |
          uv sync --locked --extra app --group app-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix tools/desktop_builder --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full software gate without production execution
        run: uv run --locked --extra app python tools/test_all.py --require-mat --jobs 4 --argyll-archive local/beta/Argyll_V3.5.0_src.zip --argyll-contribution tools/native_argyll/contributions/cr_pr --native-output local/beta/native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: corresponding-source-${{ github.sha }}
          path: local/beta/sources
      - name: Freeze and source-check the target package
        shell: pwsh
        run: |
          uv run --locked --extra app --group app-build python tools/build_desktop_app.py --instrument-build-report local/beta/native/report.json --output local/beta/application --build local/beta/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python tools/prepare_beta_assets.py --application "local/beta/application/Color Measurement" --native-report local/beta/native/report.json --source-directory local/beta/sources --output local/beta/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The corresponding-source artifact already retains the four large source
      # attachments. Combine both artifacts before delivery; do not upload them twice.
      - name: Retain candidate records and original gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}-candidate-${{ github.sha }}
          path: |
            local/beta/assets/Color-Measurement-*
            local/beta/assets/RELEASE.txt
            local/beta/assets/SOURCE-MANIFEST.json
            local/beta/assets/SHA256SUMS
            local/beta/native/report.json
            local/beta/native/**/*.log
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
